kind = "mobile"
previewPath = "/"
title = "Riider Customer"
version = "1.0.0"
id = "artifacts/rider-customer"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23200

[services.development]
run = "pnpm --filter @workspace/rider-customer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rider-customer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rider-customer", "run", "serve" ]

[services.env]
PORT = "23200"
BASE_PATH = "/"
